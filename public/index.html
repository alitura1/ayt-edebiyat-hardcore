<!DOCTYPE html>
<html lang="tr" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1F3A5F" />
  <title>AYT Edebiyat — Hardcore Hazırlık</title>

  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 50:'#EEF3F9',100:'#D5E0EF',500:'#3A5F8F',700:'#1F3A5F',900:'#142540' },
            accent:  { 500:'#C41E3A',700:'#9B1830' },
            ok:      { 500:'#2E7D32' },
            warn:    { 500:'#FFC107' },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
            display: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://rsms.me/">
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased">
  <header class="sticky top-0 z-30 bg-white/85 dark:bg-slate-900/85 backdrop-blur border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between gap-2">
      <a href="#/" class="flex items-center gap-2 font-bold text-primary-700 dark:text-primary-100">
        <span class="inline-block w-8 h-8 rounded-lg bg-primary-700 text-white grid place-items-center text-sm">AE</span>
        <span class="hidden sm:inline">AYT Edebiyat <span class="text-accent-500">·</span> Hardcore</span>
        <span class="sm:hidden">AYT Edebiyat</span>
      </a>
      <nav class="flex items-center gap-1 text-sm">
        <a id="streakBadge" href="#/" class="hidden items-center gap-1 px-2 py-1 rounded bg-accent-500/15 text-accent-500 font-bold mr-1" title="Streak"></a>
        <a href="#/atis" class="px-2 py-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800 font-bold text-accent-500" title="Hızlı Atış">⚡</a>
        <a href="#/quiz/setup" class="px-2 py-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800">Quiz</a>
        <a href="#/konular" class="px-2 py-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800">Konular</a>
        <a href="#/yazarlar" class="hidden md:inline px-2 py-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800">Yazarlar</a>
        <a href="#/koleksiyon" class="hidden md:inline px-2 py-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800">Koleksiyon</a>
        <button id="darkToggle" title="Tema" class="ml-1 px-2 py-1 rounded hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="Tema">
          <span class="dark:hidden">🌙</span>
          <span class="hidden dark:inline">☀️</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="app" class="max-w-6xl mx-auto px-4 py-6 min-h-[60vh]"></main>

  <footer class="border-t border-slate-200 dark:border-slate-800 py-6 mt-12 text-center text-xs text-slate-500">
    <div class="max-w-6xl mx-auto px-4">
      <p>AYT Edebiyat Hardcore · 192 soru · 2018-2025 analiz · MEBİ Konu Özet entegrasyonu</p>
      <p class="mt-1">Kaynaklar: MEB Ortaöğretim Genel Müdürlüğü çıkmış soru kitabı + MEBİ AYT TDE özet PDF</p>
    </div>
  </footer>

  <script type="module" src="./app.js"></script>

</html>
