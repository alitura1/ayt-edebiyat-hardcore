<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google ile giriş — AYT Edebiyat</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; text-align: center; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    h1 { margin-bottom: 8px; }
    p { color: #94a3b8; margin: 4px 0; }
    .err { color: #f87171; background: rgba(248,113,113,0.1); padding: 12px; border-radius: 8px; margin: 12px 0; max-width: 380px; }
    button { background: #1F3A5F; color: white; border: 0; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 12px; }
    button:hover { background: #142540; }
    .spinner { width: 40px; height: 40px; border: 3px solid #334155; border-top-color: #C41E3A; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 16px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>🔐</h1>
  <p id="msg">Google ile giriş yapılıyor...</p>
  <div class="spinner" id="spinner"></div>
  <div id="err" class="err" style="display:none"></div>
  <button id="closeBtn" style="display:none" onclick="window.close()">Kapat</button>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
    import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js';
    import { FIREBASE_CONFIG } from './lib/firebase-config.js';

    const channel = new BroadcastChannel('auth');

    function showErr(text) {
      document.getElementById('msg').textContent = 'Giriş başarısız';
      document.getElementById('spinner').style.display = 'none';
      const e = document.getElementById('err');
      e.style.display = 'block';
      e.innerHTML = text;
      document.getElementById('closeBtn').style.display = 'inline-block';
    }

    (async () => {
      try {
        const app = initializeApp(FIREBASE_CONFIG);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const cred = await signInWithPopup(auth, provider);
        channel.postMessage({
          type: 'auth-success',
          uid: cred.user.uid,
          email: cred.user.email,
          displayName: cred.user.displayName,
        });
        document.getElementById('msg').textContent = '✓ Giriş başarılı — pencere kapanıyor';
        document.getElementById('spinner').style.display = 'none';
        setTimeout(() => window.close(), 700);
      } catch (e) {
        channel.postMessage({ type: 'auth-error', code: e.code, message: e.message });
        let html = `<strong>Hata kodu:</strong> ${e.code || 'bilinmiyor'}<br><strong>Mesaj:</strong> ${e.message || 'Beklenmedik hata'}`;
        if (e.code === 'auth/popup-blocked') {
          html = '🚫 Bu pencere de pop-up olarak engellendi.<br>Tarayıcıdan pop-up izni ver, tekrar dene.';
        } else if (e.code === 'auth/unauthorized-domain') {
          html = '⚠ Bu domain Firebase Console\'da izinli değil.<br>Console > Authentication > Settings > Authorized domains\'e bu adresi ekle.';
        }
        showErr(html);
      }
    })();
  </script>
</body>
</html>
